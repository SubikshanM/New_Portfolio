<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contact.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <header>
    <a href="#" class="logo"><i class="fas fa-code"></i> Subikshan Mani</a>
    <div class="menu-icon" onclick="toggleMenu()" tabindex="0" role="button" aria-label="Toggle menu" onkeypress="if(event.key === 'Enter' || event.key === ' ') toggleMenu()">
      <i class="fa fa-bars-staggered"></i>
    </div>
    <nav id="navbar">
      <a href="index.html">Home</a>
      <a href="skills.html">Skills</a>
      <a href="education.html">Education</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <section class="contact">
    <h2 class="section-title fade-in">Contact <span>Info</span></h2>
    <div class="contact-container">

      <a href="mailto:subikshan.mailbox@gmail.com" class="contact-card fade-in fade-in-delay-1">
        <i class="fa-solid fa-envelope-open-text"></i>
        <h3>Email</h3>
        <p>subikshan.mailbox@gmail.com</p>
      </a>

      <a href="tel:+919095076843" class="contact-card fade-in fade-in-delay-2">
        <i class="fa-solid fa-phone-volume"></i>
        <h3>Phone</h3>
        <p>+91 90950 76843</p>
      </a>

      <a href="https://www.linkedin.com/in/subikshan-mani-ba0321290/" target="_blank" rel="noopener noreferrer" class="contact-card fade-in fade-in-delay-3">
        <i class="fa-brands fa-linkedin-in"></i>
        <h3>LinkedIn</h3>
        <p>linkedin.com/in/subikshan-mani</p>
      </a>

      <a href="https://github.com/SubikshanM" target="_blank" rel="noopener noreferrer" class="contact-card fade-in fade-in-delay-4">
        <i class="fa-brands fa-github-alt"></i>
        <h3>GitHub</h3>
        <p>github.com/SubikshanM</p>
      </a>

    </div>
  </section>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('navbar');
      nav.classList.toggle('active');
    }

    // Fade-in animation on scroll
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, observerOptions);

    document.querySelectorAll('.fade-in, .fade-in-left, .fade-in-right').forEach(el => {
        observer.observe(el);
    });
  </script>
</body>
</html>
