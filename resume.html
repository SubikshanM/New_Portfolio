<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resume - Subikshan Mani</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
    }

    .resume-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin: 0 auto;
    }

    .resume-pdf {
      width: 100%;
      height: calc(100vh - 20rem);
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 30px rgba(183, 75, 75, 0.25);
      display: block;
    }

    .resume-download {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem 2.5rem;
      background-color: var(--accent);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 600;
      border-radius: 5rem;
      text-decoration: none;
      transition: background 0.3s;
      margin-bottom: 1.5rem;
    }

    .resume-download:hover {
      background-color: var(--accent-strong);
    }

    @media (max-width: 768px) {
      .resume-pdf {
        height: 70vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo"><i class="fas fa-code"></i> Subikshan Mani</a>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="skills.html">Skills</a>
      <a href="education.html">Education</a>
      <a href="certifications.html">Certifications</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-right">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
      <div class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars-staggered"></i>
      </div>
    </div>
  </header>

  <section class="resume-section">
    <h1 class="section-title fade-in">My <span>Resume</span></h1>
    <p class="section-subtitle fade-in">View and download my professional CV and career credentials</p>

    <div class="resume-wrapper fade-in">
      <a class="resume-download" href="assets/Subikshan%20Mani%20Resume.pdf" download="Subikshan_Mani_Resume.pdf">
        <i class="fas fa-download"></i> Download Resume
      </a>
      <div id="pdf-viewer" style="width:100%;">
        <canvas id="resume-canvas" style="width:100%; display:block; border-radius:8px; box-shadow:0 4px 30px rgba(183,75,75,0.25);"></canvas>
      </div>
      <iframe id="resume-iframe" class="resume-pdf" src="assets/Subikshan%20Mani%20Resume.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="Subikshan Mani Resume" style="display:none;"></iframe>
    </div>
  </section>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const nav = document.getElementById('nav');
    toggle.addEventListener('click', () => nav.classList.toggle('active'));

    // Fade-in animation on scroll
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, observerOptions);

    document.querySelectorAll('.fade-in, .fade-in-left, .fade-in-right').forEach(el => {
        observer.observe(el);
    });
    // Theme toggle: remember user preference and apply
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.classList.add('light-theme');
        themeIcon && (themeIcon.className = 'fa-solid fa-sun');
      } else {
        document.documentElement.classList.remove('light-theme');
        themeIcon && (themeIcon.className = 'fa-solid fa-moon');
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle && themeToggle.addEventListener('click', () => {
      const current = document.documentElement.classList.contains('light-theme') ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // Render resume with PDF.js for better mobile support; iframe fallback if needed
    (function renderResume(){
      const url = 'assets/Subikshan%20Mani%20Resume.pdf';
      const iframe = document.getElementById('resume-iframe');
      if (!window.pdfjsLib) {
        // no pdf.js, show iframe
        iframe.style.display = 'block';
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      const loadingTask = pdfjsLib.getDocument(url);
      loadingTask.promise.then(pdf => {
        const viewer = document.getElementById('pdf-viewer');
        viewer.innerHTML = ''; // clear placeholder canvas
        
        let renderPromise = Promise.resolve();
        for (let i = 1; i <= pdf.numPages; i++) {
          renderPromise = renderPromise.then(() => {
            return pdf.getPage(i).then(page => {
              const viewport = page.getViewport({ scale: 1.0 });
              const containerWidth = Math.min(window.innerWidth * 0.95, 1100);
              const scale = containerWidth / viewport.width;
              const scaledViewport = page.getViewport({ scale });
              
              const canvas = document.createElement('canvas');
              canvas.style.width = '100%';
              canvas.style.display = 'block';
              canvas.style.borderRadius = '8px';
              canvas.style.boxShadow = '0 4px 30px rgba(183,75,75,0.25)';
              canvas.style.marginBottom = '2rem';
              canvas.width = scaledViewport.width;
              canvas.height = scaledViewport.height;
              viewer.appendChild(canvas);
              
              const context = canvas.getContext('2d');
              const renderContext = {
                canvasContext: context,
                viewport: scaledViewport
              };
              return page.render(renderContext).promise;
            });
          });
        }
        return renderPromise;
      }).catch((err) => {
        console.error("PDF rendering failed:", err);
        // fallback to iframe
        iframe.style.display = 'block';
      });
    })();
  </script>
</body>
</html>
